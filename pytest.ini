# Config for the dags/ unit tests (tests/). `make test` mounts this and tests/
# into the hardened image at /opt/airflow and runs pytest from there; the DAGs
# themselves are already in the image (Dockerfile: COPY dags/).
[pytest]
testpaths = tests
# Two roots on sys.path:
#   .    -> so `import tests`, `tests.dagtest_util`, `tests.test_<project>...`
#           resolve (tests/ is a package now, one subpackage per project).
#   dags -> so DAG files' `from <project>.common.greetings import ...` resolves
#           during collection (conftest.py also inserts this, belt and braces).
pythonpath = . dags
addopts = -ra -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
