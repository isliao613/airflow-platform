# Config for the dags/ unit tests (tests/). `make test` mounts this and tests/
# into the hardened image at /opt/airflow and runs pytest from there; the DAGs
# themselves are already in the image (Dockerfile: COPY dags/).
[pytest]
testpaths = tests
# dags/ on sys.path so DAG files' `from common.greetings import ...` resolves
# during collection (conftest.py also does this, belt and braces).
pythonpath = dags
addopts = -ra -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
