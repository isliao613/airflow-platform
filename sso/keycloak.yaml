# Keycloak for local SSO, deployed alongside Airflow in the same namespace.
#
# The realm (groups, users, Airflow client) is imported at startup from the
# ConfigMap that `make sso` generates out of sso/realm-airflow.json.
#
# URL consistency matters here: OIDC tokens carry an issuer, and the browser and
# the Airflow API server must agree on it. Both therefore reach Keycloak at
# exactly http://localhost:8081 --
#   * browser  -> host port 8081 -> kind extraPortMapping -> NodePort 30081
#   * airflow  -> a socat sidecar in the api-server pod listening on 127.0.0.1:8081
# See apiServer.extraContainers in values.yaml for the sidecar.
apiVersion: v1
kind: Service
metadata:
  name: airflow-keycloak
  namespace: airflow
  labels:
    app: airflow-keycloak
spec:
  type: NodePort
  selector:
    app: airflow-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-keycloak
  namespace: airflow
  labels:
    app: airflow-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-keycloak
  template:
    metadata:
      labels:
        app: airflow-keycloak
    spec:
      containers:
        - name: keycloak
          image: KEYCLOAK_IMAGE_PLACEHOLDER
          args: ["start-dev", "--import-realm"]
          env:
            # Dev-mode admin for the Keycloak console itself (http://localhost:8081).
            # Unrelated to the three Airflow users in the imported realm.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            # Must match the URL both the browser and Airflow use, or the issuer
            # in the issued tokens will not line up.
            - name: KC_HOSTNAME
              value: "http://localhost:8081"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            # Serving the realm endpoint means the import finished, which is the
            # signal the Airflow deploy actually needs.
            httpGet:
              path: /realms/airflow
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: realm-import
          configMap:
            name: airflow-keycloak-realm
