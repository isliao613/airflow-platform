# Vault for local secret storage, deployed alongside Keycloak and Airflow in
# the same namespace. Dev mode (in-memory storage, auto-unsealed, a `secret/`
# KV v2 mount created for free) -- this is a `kind` dev platform, not
# somewhere Vault needs to survive a restart. vault/seed-secrets.sh re-seeds
# it from scratch every time `make vault` runs, same spirit as `make sso`
# always re-importing the Keycloak realm.
#
# Nothing automated reaches Vault over the network: the Makefile talks to it
# via `kubectl exec` (see vault/seed-secrets.sh and vault/sync-secrets.sh),
# which attaches directly into the pod's own network namespace, so
# VAULT_ADDR pointing at 127.0.0.1 is enough. The NodePort below exists
# purely so a human can browse the UI at http://localhost:8200, same as
# Keycloak's console at :8181 -- see kind-config.yaml for the matching
# extraPortMapping.
#
# VAULT_DEV_ROOT_TOKEN_ID is the one credential in this repo that
# structurally cannot live in Vault itself -- it's what authenticates to
# Vault in the first place. What it unlocks (the OIDC client secret and the
# API secret key -- see vault/seed-secrets.sh for that single source of
# truth) does live in Vault. Note this token is also now reachable from the
# host at localhost:8200: fine for a throwaway local `kind` cluster, but not
# a pattern to carry into anything internet-facing.
apiVersion: v1
kind: Service
metadata:
  name: airflow-vault
  namespace: airflow
  labels:
    app: airflow-vault
spec:
  type: NodePort
  selector:
    app: airflow-vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-vault
  namespace: airflow
  labels:
    app: airflow-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-vault
  template:
    metadata:
      labels:
        app: airflow-vault
    spec:
      containers:
        - name: vault
          image: VAULT_IMAGE_PLACEHOLDER
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "airflow-local-dev-root-token"
            # Makes the `vault` CLI usable via plain `kubectl exec ... --
            # vault kv ...`, with no `-address`/`login` step, from inside the
            # pod's own network namespace.
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            - name: VAULT_TOKEN
              value: "airflow-local-dev-root-token"
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
