# Config for this stack's dags/ unit tests (compose/tests/). `make test` mounts
# compose/ into the stack's own image at /opt/airflow and runs pytest from
# there. Unlike the repo-root stack, the DAGs are NOT baked into the image --
# they are bind-mounted at run time -- so the test container mounts them too.
[pytest]
testpaths = tests
# Two roots on sys.path:
#   .    -> so `import tests`, `tests.conftest`, `tests.test_<project>...`
#           resolve (tests/ is a package, one subpackage per project).
#   dags -> so DAG files' `from <project>.common.greetings import ...` resolves
#           during collection (conftest.py also inserts this, belt and braces).
pythonpath = . dags
addopts = -ra -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
