# Values for this repo's own umbrella chart (Chart.yaml), which wraps the
# apache-airflow/airflow chart 1.22.0 as a dependency (mirrored to Docker Hub
# as an OCI artifact, see CHART_OCI_REPO in the Makefile) so it deploys as a
# single Helm release together with this chart's own templates/. Overrides
# for the airflow subchart go under the `airflow:` key below -- that's Helm's
# own convention for addressing a dependency's values, matching the
# dependency's `name:` in Chart.yaml. Exposes the API server via the kind
# cluster's NodePort 30080 -> host port 8080 (see kind-config.yaml).
#
# The Airflow version and image below are placeholder tokens, not literal
# values -- `make deploy` runs this file through `sed` (see RENDERED_VALUES
# in the Makefile) to substitute them from AIRFLOW_VERSION / IMAGE_REPO /
# IMAGE_TAG, its single source of truth, so the image that `make build`
# produces is always the image the pods run and never has to be kept in sync
# by hand in two places. The top-level `image:` key at the bottom of this
# file is filled in from the same two Makefile variables, since the
# sync-roles Job must run the identical image.
#
# Consequence: installing this file with plain `helm` instead of `make
# deploy` installs these placeholder strings as literal, broken values --
# always go through `make deploy` (or `make dep-build` + manually sed the
# file the same way, if you need to call `helm upgrade` directly).

airflow:
  airflowVersion: AIRFLOW_VERSION_PLACEHOLDER
  defaultAirflowRepository: IMAGE_REPO_PLACEHOLDER
  defaultAirflowTag: IMAGE_TAG_PLACEHOLDER

  # Airflow 3 multi-executor (the old hybrid CeleryKubernetesExecutor was
  # removed in 3.0). First entry is the default; the chart renders the
  # Celery workers AND the KubernetesExecutor pod template + pod-spawn RBAC
  # because the string contains both names.
  #   * Option A -- Celery worker classes (small/medium/large) for the
  #     common case, picked per DAG/task with `queue=`.
  #   * Option B -- a task with `executor="KubernetesExecutor"` runs as its
  #     OWN pod, sized from the DAG via
  #     executor_config={"pod_override": V1Pod(...)}, for one-off resource
  #     needs that don't fit a fixed class.
  executor: "CeleryExecutor,KubernetesExecutor"

  config:
    operators:
      # Tasks with no explicit `queue` run on the `small` Celery class.
      default_queue: small
    logging:
      # Task logs go to MinIO (minio/minio.yaml), not the worker's local
      # disk -- so the Celery workers can be stateless Deployments
      # (workers.persistence.enabled: false, below) and KubernetesExecutor
      # task pods keep their logs after the pod is deleted. The connection
      # AIRFLOW_CONN_MINIO_S3 is sourced from Vault (see the `secret:` list).
      remote_logging: "True"
      remote_base_log_folder: "s3://airflow-logs"
      remote_log_conn_id: "minio_s3"

  # --- Option A: Celery worker classes ---------------------------------
  # Chart 1.22 renders one Deployment per "worker set" in celery.sets. Each
  # has its own queue, resources, replica count, and (if enabled) KEDA
  # scaler. enableDefault is off so there is no unnamed base worker: every
  # class is an explicit set, giving evenly named Deployments
  # <release>-worker-small / -medium / -large.
  #
  # Resource values here are starting points -- size them for your nodes;
  # on a single-node kind cluster keep them small or pods stay Pending.
  #
  # Route a DAG to a class:   with DAG(..., default_args={"queue": "medium"})
  # Route a single task:      @task(queue="large")
  workers:
    # Stateless: no per-pod PVC, so each worker set renders as a Deployment
    # instead of a StatefulSet. Safe because task logs go to MinIO (config.
    # logging above), not the worker's local disk.
    persistence:
      enabled: false
    celery:
      enableDefault: false
      sets:
        - name: small
          queue: small
          replicas: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
        - name: medium
          queue: medium
          replicas: 1
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
        - name: large
          queue: large
          replicas: 1
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi

  # Chart 1.22.0 renders the api secret as an ordinary resource with a
  # `randAlphaNum 32` default, so every `helm upgrade` -- which is what
  # `make deploy` runs -- would mint a new key while the running pods keep the
  # old one in their env, silently invalidating sessions on the next restart.
  # (The fernet key is not affected: its template is a pre-install hook.)
  # Pointing at an existing Secret (rather than the literal `apiSecretKey`
  # value) makes re-deploys idempotent the same way, while sourcing the
  # actual value from Vault: vault/sync-secrets.sh materializes this Secret
  # (along with AIRFLOW_KEYCLOAK_CLIENT_SECRET below) from the single Vault
  # secret secret/airflow-platform/airflow (see vault/seed-secrets.sh).
  #
  # Named `vault-airflow-secrets`, NOT e.g. `airflow-api-secret-key`: that
  # would collide with the name the chart's own api-secret-key-secret.yaml
  # template renders when apiSecretKeySecretName is unset, and `helm upgrade`
  # garbage-collects same-named resources that drop out of the chart's
  # manifest between releases -- it deleted this Secret out from under
  # already-upgraded pods the first time this was tried with an
  # `airflow-`-prefixed name.
  apiSecretKeySecretName: "vault-airflow-secrets"

  # Same deal for the Fernet key, which encrypts Connection passwords and
  # sensitive Variables in the metadata DB. Unset, the chart renders its own
  # `<release>-fernet-key` Secret with a `randAlphaNum 32 | b64enc` value.
  # That one is already stable across upgrades (its template is a pre-install
  # hook, so it is generated once), so this is not about idempotency like
  # apiSecretKeySecretName above -- it is about the value living in Vault
  # with the rest, and being knowable rather than a random string only the
  # cluster has ever seen.
  #
  # The chart only lets us name the Secret; the key inside it is hardcoded as
  # `fernet-key` (see the chart's _helpers.yaml), which is why
  # vault/seed-secrets.sh must use exactly that key name.
  #
  # NOTE: the chart's own pre-install hook Secret `airflow-fernet-key` is not
  # garbage-collected when this is set (hook resources are not part of the
  # release manifest), so on an existing install it lingers, unused. Deleting
  # it is safe once every component reads the value from here.
  fernetKeySecretName: "vault-airflow-secrets"

  # Exposes AIRFLOW_KEYCLOAK_CLIENT_SECRET (read by apiServerConfig below) as
  # an env var on every Airflow container, sourced from the same
  # vault-airflow-secrets Secret as apiSecretKeySecretName above (a
  # different key on the same Secret object, not a separate one -- both
  # values come from one Vault secret) -- the same client secret value
  # Keycloak's own client is configured with (see sso/realm-airflow.json's
  # VAULT_OIDC_CLIENT_SECRET_PLACEHOLDER).
  secret:
    - envName: "AIRFLOW_KEYCLOAK_CLIENT_SECRET"
      secretName: "vault-airflow-secrets"
      secretKey: "client-secret"
    # Airflow connection to MinIO for remote task logging (config.logging
    # above references it as remote_log_conn_id: minio_s3). Same Vault
    # secret, different key -- a full JSON connection string built in
    # vault/seed-secrets.sh.
    - envName: "AIRFLOW_CONN_MINIO_S3"
      secretName: "vault-airflow-secrets"
      secretKey: "minio-logging-conn"

  # --- Metadata database: bundled Postgres, replication mode -------------
  # 1 primary + 2 read replicas (bitnami/postgresql streaming replication),
  # fronted by the chart's own PgBouncer. bitnami/postgresql is NOT an HA
  # chart -- the replicas are plain read-only standbys and nothing promotes
  # one automatically. Failover is a manual, break-glass step:
  # postgres/failover.sh  (or `make db-failover`).
  postgresql:
    architecture: replication
    # Both database passwords come from the Vault-synced Secret by
    # reference, the same shape as apiSecretKeySecretName above -- no
    # literal here, and the bitnami subchart stops rendering its own
    # `airflow-postgresql` Secret entirely. `secretKeys` is what makes this
    # work against a Secret we did not design for it: bitnami looks for
    # `postgres-password` / `replication-password` by default, and this
    # remaps those lookups onto our own key names.
    #
    # Pinning them at all matters for the same reason as
    # apiSecretKeySecretName: left to the chart, `helm upgrade` churns a
    # newly generated password on every deploy.
    #
    # This is the postgres SERVER side. Airflow's own side is
    # data.metadataSecretName below -- with no PgBouncer in the way, both are
    # plain Secret references and no database credential reaches Helm as a
    # value at all.
    auth:
      existingSecret: "vault-airflow-secrets"
      secretKeys:
        adminPasswordKey: "metadata-db-password"
        replicationPasswordKey: "replication-password"
    primary:
      persistence:
        size: 2Gi
      # Airflow opens a connection per scheduler, per worker process, per
      # triggerer, per dag-processor, AND per running task. With no PgBouncer
      # in front (pgbouncer.enabled: false below) those all land here
      # directly, so the stock max_connections=100 is the ceiling that gets
      # hit first. Raise it rather than discover it under load. Size this
      # against your real worker concurrency: roughly
      # (workers x worker_concurrency) + ~15 for the always-on components.
      extendedConfiguration: |
        max_connections = 500
      # Postgres forks a process per connection (~5-10MB each), so
      # max_connections is also a memory budget: 500 x ~8MB is roughly 4Gi
      # worst case. The limit below is sized for that -- raising
      # max_connections without raising this just moves the failure from
      # "too many clients" to an OOMKill.
      #
      # Memory limit but no CPU limit, matching the worker classes below:
      # a CPU limit only buys throttling, and the database is the one thing
      # here that should never be throttled.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 4Gi
    readReplicas:
      replicaCount: 2
      persistence:
        size: 2Gi
      # Same max_connections as the primary, deliberately: a replica is a
      # promotion target (postgres/failover.sh), and after `pg_promote` it
      # IS the primary. Leaving it at the stock 100 would mean surviving the
      # failover only to exhaust connections minutes later -- and a replica
      # cannot be reconfigured mid-incident without another restart.
      extendedConfiguration: |
        max_connections = 500
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 4Gi

  # No connection pooler: every Airflow component connects straight to
  # Postgres. This is deliberate -- see `primary.extendedConfiguration`
  # above for the max_connections headroom that replaces the pooling, and
  # the README for the trade-off.
  #
  # It is also what lets the metadata credential stay a pure Secret
  # reference (data.metadataSecretName below). The chart builds PgBouncer's
  # users.txt from the LITERAL Helm value data.metadataConnection.pass, with
  # no Secret-reference equivalent -- so with PgBouncer on, that password has
  # to reach Helm as a value no matter where it is stored.
  pgbouncer:
    enabled: false

  # The whole metadata DSN comes from the Vault-synced Secret, under its
  # `connection` key (the name the chart looks for). Nothing about the
  # database -- password, host, port, user -- appears in this file; it is
  # assembled in vault/seed-secrets.sh, which is the single source of truth
  # for it.
  #
  # The DSN's host is the `airflow-postgresql-primary` SERVICE, not a pod.
  # That indirection is what postgres/failover.sh relies on: it repoints
  # that Service's selector at the promoted replica, so the connection
  # string stays valid across a manual failover and no Airflow component
  # needs reconfiguring. (In replication mode bitnami names the Service
  # `-primary`; there is no plain `airflow-postgresql`.)
  #
  # resultBackendSecretName is left unset: the chart falls back to this same
  # metadata connection for the Celery result backend.
  data:
    metadataSecretName: "vault-airflow-secrets"

  # Chart 1.22.0's migration job runs only `airflow db migrate`. The FAB auth
  # manager keeps its own alembic history (users, roles, permissions) that is
  # migrated by `airflow fab-db migrate`, and nothing in the chart runs it.
  # Since this deployment authenticates through FAB, run both here. Both are
  # idempotent.
  migrateDatabaseJob:
    args:
      - "bash"
      - "-c"
      - "airflow db migrate && airflow fab-db migrate"

  # The chart's default createUserJob mints a local admin/admin. Under
  # AUTH_TYPE = AUTH_OAUTH the login form is gone, so that user can never sign
  # in and only adds a confusing failure mode. Identities come from Keycloak.
  createUserJob:
    enabled: false

  apiServer:
    service:
      type: NodePort
      ports:
        - name: api-server
          port: 8080
          targetPort: 8080
          nodePort: 30080

    # Flask-AppBuilder config for Keycloak SSO. Rendered through Helm's `tpl`
    # (see chart templates/configmaps/api-server-configmap.yaml) and mounted
    # at /opt/airflow/webserver_config.py -- safe because this file has no
    # `{{ }}` Go-template syntax, only Python's own `{}` dict/f-string
    # literals, which `tpl` ignores.
    #
    # Also referenced below as webserver.webserverConfig (same anchor, no
    # copy-paste): the api-server component reads apiServer.apiServerConfig,
    # but scheduler/worker/triggerer/dag-processor all still mount
    # webserver.webserverConfig instead -- an Airflow-3 chart quirk from
    # splitting the webserver into api-server without updating every
    # component's config-mount key. Every component needs the same
    # AUTH_ROLES_MAPPING to authorize consistently, so both must be set.
    #
    # Roles come from Keycloak groups, not from Airflow:
    # AUTH_ROLES_SYNC_AT_LOGIN re-reads the `groups` claim on every login and
    # rewrites the user's roles, so group membership in Keycloak is the
    # single source of truth. The team roles themselves are created by
    # `airflow roles import` (see chart/files/roles/demo.json) and deliberately
    # hold no global `DAGs` permission -- per-DAG access is granted only by
    # the `access_control` mapping in each DAG file.
    apiServerConfig: &webserverConfig |
      from __future__ import annotations

      import os

      from flask_appbuilder.security.manager import AUTH_OAUTH

      # Keycloak is reached at the same URL from the browser and from this pod
      # (via the socat sidecar), so the issuer in the tokens lines up on both
      # sides.
      KEYCLOAK_BASE_URL = os.environ.get("AIRFLOW_KEYCLOAK_BASE_URL", "http://localhost:8181")
      KEYCLOAK_REALM = os.environ.get("AIRFLOW_KEYCLOAK_REALM", "airflow")
      _REALM_URL = f"{KEYCLOAK_BASE_URL}/realms/{KEYCLOAK_REALM}"

      AUTH_TYPE = AUTH_OAUTH

      # First OAuth login creates the Airflow user. Public grants nothing on its
      # own; anyone not in one of the three groups below lands here and sees no
      # DAGs.
      AUTH_USER_REGISTRATION = True
      AUTH_USER_REGISTRATION_ROLE = "Public"
      AUTH_ROLES_SYNC_AT_LOGIN = True

      AUTH_ROLES_MAPPING = {
          "airflow-team-a": ["team_a"],
          "airflow-team-b": ["team_b"],
          "airflow-team-c": ["team_c"],
          # Built-in role -- needs no entry in chart/files/roles/demo.json. Holds
          # global `DAGs` permission, so this group sees every team's DAG.
          "airflow-admins": ["Admin"],
      }

      OAUTH_PROVIDERS = [
          {
              # The name "keycloak" is significant: Flask-AppBuilder ships a
              # handler for it that reads the userinfo endpoint and maps the
              # `groups` claim onto role_keys, which is what AUTH_ROLES_MAPPING
              # consumes.
              "name": "keycloak",
              "icon": "fa-key",
              "token_key": "access_token",
              "remote_app": {
                  "client_id": os.environ.get("AIRFLOW_KEYCLOAK_CLIENT_ID", "airflow"),
                  # No fallback default here on purpose: this comes from
                  # Vault (see the top-level `secret:` list below), and a
                  # missing env var should fail loudly rather than silently
                  # authenticating against a stale hardcoded value.
                  "client_secret": os.environ["AIRFLOW_KEYCLOAK_CLIENT_SECRET"],
                  "server_metadata_url": f"{_REALM_URL}/.well-known/openid-configuration",
                  # FAB appends "openid-connect/userinfo" to this base.
                  "api_base_url": f"{_REALM_URL}/protocol/",
                  "client_kwargs": {"scope": "openid email profile"},
              },
          }
      ]

    # Publishes Keycloak inside the api-server pod at the exact URL the
    # browser uses (http://localhost:8181), so the OIDC issuer matches on
    # both sides. Without this the browser would need a cluster-internal
    # hostname, or Airflow a host-side one, and the issuer check would fail
    # either way.
    #
    # Runs the Airflow image itself (already loaded into kind, with socat
    # installed by the Dockerfile) to avoid pulling a second image just to
    # forward a port. `.image` is overridden from the Makefile.
    extraContainers:
      - name: keycloak-proxy
        image: PLACEHOLDER_SET_FROM_MAKEFILE
        command: ["socat"]
        args:
          - "TCP-LISTEN:8181,fork,reuseaddr"
          - "TCP:airflow-keycloak:8080"
        ports:
          - name: keycloak
            containerPort: 8181
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

  # scheduler/worker/triggerer/dag-processor mount webserver_config.py via
  # this key, not apiServer.apiServerConfig (see the comment on that key
  # above) -- the YAML anchor keeps both in lockstep from one definition.
  webserver:
    webserverConfig: *webserverConfig

# Image for this chart's own templates/sync-roles-job.yaml (the hook
# Job that creates the team roles and applies each DAG's access_control). Not
# under the `airflow:` key since this Job isn't part of the airflow
# dependency -- but it invokes the `airflow` CLI directly, so it must run the
# SAME image, hence the same Makefile placeholder tokens as above.
image:
  repository: IMAGE_REPO_PLACEHOLDER
  tag: IMAGE_TAG_PLACEHOLDER

# Where the sync-roles hook Job gets its role files from (see
# chart/templates/sync-roles-job.yaml). The Job mounts EVERY *.json key of
# the chosen ConfigMap under /opt/airflow/roles and reconciles their union
# -- one file per project (demo, project1, project2, ...).
#
#   configMapName: ""       -> the chart renders its own ConfigMap from
#                              every files/roles/*.json in this chart (the
#                              demo team_a/b/c set plus the project1/
#                              project2 scaffolds). This is the `make up`
#                              path: zero setup. Add a project by dropping
#                              files/roles/<project>.json.
#   configMapName: my-roles -> the Job instead mounts the existing,
#                              operator-managed ConfigMap `my-roles`; every
#                              key of it ending in `.json` is treated as a
#                              role file. The chart does NOT render or own
#                              any role file in this mode -- create/update
#                              `my-roles` out of band (kubectl apply,
#                              Kustomize, Argo CD, ...) and re-run the hook
#                              (any `helm upgrade`) to reconcile. A missing
#                              ConfigMap makes the hook pod fail to start.
#
# reconcile_roles.py is always chart-owned (it's logic, not operator data)
# and mounts from its own chart-rendered ConfigMap regardless of this.
teamRoles:
  configMapName: ""
