# Post-install/post-upgrade hook: creates the team roles (airflow roles
# import) and applies each DAG's access_control (airflow sync-perm
# --include-dags). Replaces the old Makefile `sso-perms` target's kubectl
# exec + kubectl cp + polling shell logic with a declarative Helm hook.
#
# Lives directly in this chart's own templates/ (this IS the root chart,
# chart/Chart.yaml) alongside the airflow dependency, so it's always
# installed as part of the SAME Helm release as the airflow chart --
# .Release.Name below is therefore guaranteed to be that release, and this
# Job can read its secrets/ConfigMap directly (confirmed against a live
# apache-airflow chart 1.22.0 deploy):
#   - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN <- secret "<release>-metadata" key "connection"
#   - AIRFLOW__CORE__FERNET_KEY           <- secret "<release>-fernet-key" key "fernet-key"
#   - /opt/airflow/airflow.cfg            <- configmap "<release>-config" key "airflow.cfg"
# The airflow.cfg mount is not optional: it's where the chart sets
# `[core] auth_manager = ...FabAuthManager`. Without it, `airflow roles
# import` fails with `AirflowSecurityManagerV2 has no attribute
# get_all_roles` (found by actually running this Job without the mount).
#
# Helm merges hooks from the root chart and its dependencies into one
# ordering for the release, sorted by hook-weight -- so weight "5" here still
# runs after the airflow dependency's own migrate-database-job (weight "1")
# and create-user-job (weight "2"), confirmed by reading those templates.
#
# Helm always waits for hook Jobs to complete before considering the release
# successful, regardless of --wait -- so `helm upgrade --install` blocks
# until this finishes (or --timeout expires), same as the old target did.
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-team-roles
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync-team-roles
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "waiting for the dag processor to serialize the team DAGs..."
              for i in $(seq 1 60); do
                found=$(airflow dags list -o plain 2>/dev/null \
                  | grep -cE '^team_[abc]_pipeline' || true)
                if [ "$found" -ge 3 ]; then
                  echo "all 3 team DAGs serialized"
                  break
                fi
                if [ "$i" = "60" ]; then
                  echo "ERROR: team DAGs did not appear within 5m"
                  exit 1
                fi
                sleep 5
              done
              echo "creating team roles..."
              airflow roles import /opt/airflow/team-roles/roles.json
              echo "applying per-DAG access_control..."
              airflow sync-perm --include-dags
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-metadata
                  key: connection
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-fernet-key
                  key: fernet-key
          volumeMounts:
            - name: airflow-config
              mountPath: /opt/airflow/airflow.cfg
              subPath: airflow.cfg
              readOnly: true
            - name: team-roles
              mountPath: /opt/airflow/team-roles
              readOnly: true
      volumes:
        - name: airflow-config
          configMap:
            name: {{ .Release.Name }}-config
        - name: team-roles
          configMap:
            name: team-roles
